<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="scene.css">
<style>
  .page { position: absolute; left: 50%; top: 92px; width: 860px; height: 470px; margin-left: -430px; transform: rotate(-1.4deg);
    background-color: #fffdf8; border: 1px solid var(--rule); border-radius: 2px;
    box-shadow: 0 1px 0 rgba(28,25,23,.04), 0 26px 50px -28px rgba(28,25,23,.45);
    background-image: linear-gradient(90deg, transparent 64px, rgba(139,26,26,.25) 64px, rgba(139,26,26,.25) 65px, transparent 65px),
      repeating-linear-gradient(to bottom, transparent 0, transparent 53px, rgba(42,102,168,.18) 53px, rgba(42,102,168,.18) 54px);
    background-position: 0 30px; padding: 34px 40px 0 90px; opacity: 0; animation: fade 0.9s ease-out 0.2s forwards; }
  .line { font-family: "La Belle Aurore", cursive; font-size: 34px; line-height: 54px; color: #2b2a6b; white-space: nowrap; clip-path: inset(0 100% 0 0); }
  .date { color: var(--accent); }
</style></head><body>
<div class="brand">Egon <em>Notebooks</em></div>
<div class="step">I. Write</div>
<div class="page">
  <p class="line date" style="animation: write 1.3s linear 1.1s forwards">Sunday, 16 March</p>
  <p class="line" style="animation: write 1.9s linear 2.6s forwards">Sundays are still difficult,</p>
  <p class="line" style="animation: write 2.2s linear 4.6s forwards">but today was one of the better ones.</p>
  <p class="line" style="animation: write 2.1s linear 7.0s forwards">I made a real breakfast and watched</p>
  <p class="line" style="animation: write 2.2s linear 9.2s forwards">the rain, without trying to be productive.</p>
  <p class="line" style="animation: write 1.9s linear 11.6s forwards">The days are getting longer. I notice.</p>
</div>
<p class="caption" style="animation-delay: 1.6s">Write a little each day.</p>
</body></html>
